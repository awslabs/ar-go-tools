targets:
  - name: main
    files: ["./"]

dataflow-problems:
  summarize-on-demand: true
  user-specs:
    - "specs.yaml"
  check-ignores-unsound: true
  taint-tracking:
    - tag: "sensitive-data-leak"
      targets: [ "main" ]
      sources:
        - package: "(testprog)|(main)|(command-line-arguments)"
          method: "GetUserInput"
      sinks:
        - package: "(testprog)|(main)|(command-line-arguments)"
          method: "LogPublicly"
      sanitizers:
        - package: "(testprog)|(main)|(command-line-arguments)"
          method: "Sanitize"

options:
  log-level: 3
