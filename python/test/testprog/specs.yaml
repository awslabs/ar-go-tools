dataflow-summaries:
  - package: "github.com/awslabs/ar-go-tools/python/test/testprog"
    function: "SimpleFunction"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
  
  - package: "github.com/awslabs/ar-go-tools/python/test/testprog"
    receiver: "*DataProcessor"
    method: "Process"
    flows:
      - from: "(!receiver).buffer[*]"
        to: "(!ret 0)[*]"
      - from: "(!arg 0)[*]"
        to: "(!ret 0)[*]"
      - from: "!receiver"
        to: "!arg 0"
      - from: "(!receiver).buffer[*]"
        to: "(!receiver).buffer[*]"
      - from: "(!arg 0)[*]"
        to: "(!receiver).buffer[*]"
  
  - package: "github.com/awslabs/ar-go-tools/python/test/testprog"
    function: "ReadAndTransform"
    flows:
      - from: "!arg 0"
        to: "(!ret 0)[*]"
      - from: "!arg 0"
        to: "!ret 1"
  
  - package: "github.com/awslabs/ar-go-tools/python/test/testprog"
    function: "MultipleReturns"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 1"
