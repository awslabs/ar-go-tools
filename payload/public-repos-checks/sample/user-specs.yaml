dataflow-summaries:
  - package: "crypto/ecdsa"
    function: "SignASN1"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "(!arg 1).PublicKey.Curve"
        to: "!ret 0"
      - from: "(!arg 1).PublicKey.Curve"
        to: "!ret 1"
      - from: "(!arg 1).D"
        to: "!ret 0"
      - from: "(!arg 1).D"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
