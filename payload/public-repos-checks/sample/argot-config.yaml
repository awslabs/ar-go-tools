# Argot Configuration File
# Generated for sample Go project

options:
  project-root: "./"                    # Root directory for relative paths
  reports-dir: "logs/argot"             # Directory for analysis reports
  log-level: 3                          # Info level logging (1=Error, 2=Warn, 3=Info, 4=Debug, 5=Trace)
  report-paths: true                    # Generate detailed path reports for dataflow analyses
  analysis-options:
    unsafe-max-depth: 15               # Limit call depth for faster analysis
    max-alarms: 30                      # Maximum number of alarms to report

targets:
  - name: "sample-main"
    files:
      - "./main.go"                     # Main program entry point

dataflow-problems:
  summarize-on-demand: true
  user-specs:
    - user-specs.yaml
  generate-unsoundness-report: true
  taint-tracking:
    - tag: "data-logging"
      description: "Untrusted data is being logged"
      targets: 
      - sample-main
      sources:
        - method: "^Text$"
          package: "bufio"
      sinks:
        - method: "Printf"
          package: "fmt"
          
