dataflow-summaries:
  # encoding/hex.EncodeToString
  # Converts bytes to hex string
  - package: "encoding/hex"
    function: "EncodeToString"
    flows:
      - from: "(!arg 0)[*]"
        to: "!ret 0"

  # encoding/hex.DecodeString
  # Decodes hex string to bytes
  - package: "encoding/hex"
    function: "DecodeString"
    flows:
      - from: "!arg 0"
        to: "(!ret 0)[*]"
      - from: "!arg 0"
        to: "!ret 1"

  # crypto/x509.ParseECPrivateKey
  # Parses DER-encoded EC private key
  - package: "crypto/x509"
    function: "ParseECPrivateKey"
    flows:
      - from: "(!arg 0)[*]"
        to: "!ret 0"
      - from: "(!arg 0)[*]"
        to: "!ret 1"

  # crypto/cipher.NewGCM
  # Creates GCM cipher from block cipher
  - package: "crypto/cipher"
    function: "NewGCM"
    flows:
      - from: "!arg 0"
        to: "!ret 0"

  # crypto/aes.NewCipher
  # Creates AES cipher from key
  - package: "crypto/aes"
    function: "NewCipher"
    flows:
      - from: "(!arg 0)[*]"
        to: "!ret 0"
      - from: "(!arg 0)[*]"
        to: "!ret 1"

  # strings.TrimSpace
  # Trims whitespace from string
  - package: "strings"
    function: "TrimSpace"
    flows:
      - from: "!arg 0"
        to: "!ret 0"

  # io/ioutil.ReadFile
  # Reads file contents
  - package: "io/ioutil"
    function: "ReadFile"
    flows:
      - from: "!arg 0"
        to: "(!ret 0)[*]"
      - from: "!arg 0"
        to: "!ret 1"

  # github.com/aws/aws-sdk-go/aws.String
  # Converts string value to pointer
  - package: "github.com/aws/aws-sdk-go/aws"
    function: "String"
    flows:
      - from: "!arg 0"
        to: "!ret 0"

  # crypto/internal/fips140/nistec/fiat.*P224Element.Square
  # Squares P224 element (modifies receiver)
  - package: "crypto/internal/fips140/nistec/fiat"
    receiver: "*P224Element"
    method: "Square"
    flows:
      - from: "(!arg 0).x"
        to: "(!receiver).x"
      - from: "(!arg 0).x"
        to: "(!ret 0).x"

  # crypto/internal/fips140/nistec/fiat.*P384Element.Square
  # Squares P384 element (modifies receiver)
  - package: "crypto/internal/fips140/nistec/fiat"
    receiver: "*P384Element"
    method: "Square"
    flows:
      - from: "(!arg 0).x"
        to: "(!receiver).x"
      - from: "(!arg 0).x"
        to: "(!ret 0).x"

  # crypto/internal/fips140/nistec/fiat.*P521Element.Square
  # Squares P521 element (modifies receiver)
  - package: "crypto/internal/fips140/nistec/fiat"
    receiver: "*P521Element"
    method: "Square"
    flows:
      - from: "(!arg 0).x"
        to: "(!receiver).x"
      - from: "(!arg 0).x"
        to: "(!ret 0).x"

  # fmt.Stringer.String interface method
  # All String() methods flow receiver to return
  - package: "fmt"
    interface: "Stringer"
    method: "String"
    flows:
      - from: "!receiver"
        to: "!ret 0"

  # github.com/aws/aws-sdk-go/private/protocol/rest.Build
  # Builds REST request from parameters
  - package: "github.com/aws/aws-sdk-go/private/protocol/rest"
    function: "Build"
    flows:
      - from: "(!arg 0).Params"
        to: "(!arg 0).HTTPRequest"
      - from: "(!arg 0).Params"
        to: "(!arg 0).Body"

  # crypto/elliptic.MarshalCompressed
  # Marshals EC point to compressed format
  - package: "crypto/elliptic"
    function: "MarshalCompressed"
    flows:
      - from: "!arg 0"
        to: "(!ret 0)[*]"
      - from: "!arg 1"
        to: "(!ret 0)[*]"
      - from: "!arg 2"
        to: "(!ret 0)[*]"

  # crypto/elliptic.GenerateKey
  # Generates EC key pair
  - package: "crypto/elliptic"
    function: "GenerateKey"
    flows:
      - from: "!arg 0"
        to: "(!ret 0)[*]"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 0"
        to: "!ret 2"
      - from: "!arg 0"
        to: "!ret 3"
      - from: "!arg 1"
        to: "(!ret 0)[*]"
      - from: "!arg 1"
        to: "!ret 3"

  # encoding/base64.*Encoding.EncodeToString
  # Encodes bytes to base64 string
  - package: "encoding/base64"
    receiver: "*Encoding"
    method: "EncodeToString"
    flows:
      - from: "!receiver"
        to: "!ret 0"
      - from: "(!arg 0)[*]"
        to: "!ret 0"

  # crypto/internal/fips140/hmac.*HMAC.Sum
  # Computes HMAC sum
  - package: "crypto/internal/fips140/hmac"
    receiver: "*HMAC"
    method: "Sum"
    flows:
      - from: "(!receiver).inner"
        to: "(!ret 0)[*]"
      - from: "(!receiver).outer"
        to: "(!ret 0)[*]"
      - from: "(!receiver).opad"
        to: "(!ret 0)[*]"
      - from: "(!receiver).keyLen"
        to: "(!ret 0)[*]"
      - from: "(!arg 0)[*]"
        to: "(!ret 0)[*]"

  # crypto/ecdsa.*PrivateKey.Sign
  # Signs digest with ECDSA private key
  - package: "crypto/ecdsa"
    receiver: "*PrivateKey"
    method: "Sign"
    flows:
      - from: "!receiver"
        to: "(!ret 0)[*]"
      - from: "!arg 0"
        to: "(!ret 0)[*]"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "(!arg 1)[*]"
        to: "(!ret 0)[*]"
      - from: "(!arg 1)[*]"
        to: "!ret 1"
      - from: "!arg 2"
        to: "(!ret 0)[*]"
      - from: "!arg 2"
        to: "!ret 1"
