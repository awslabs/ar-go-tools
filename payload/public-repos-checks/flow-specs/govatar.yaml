dataflow-summaries:
  - package: "text/template"
    receiver: "*Template"
    method: "Funcs"
    flows:
      - from: "!arg 0"
        to: "(!receiver).common.execFuncs"
      - from: "!arg 0"
        to: "(!receiver).common.parseFuncs"
      - from: "!receiver"
        to: "!ret 0"

  - package: "text/template"
    receiver: "*Template"
    method: "Execute"
    flows:
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"
