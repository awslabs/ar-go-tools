dataflow-summaries:
  - package: "github.com/dgraph-io/ristretto/v2/z"
    function: "Munmap"
    flows:
      - from: "!arg 0"
        to: "!ret 0"

  - package: "github.com/dgraph-io/ristretto/v2/z"
    function: "mremap"
    flows:
      - from: "(!arg 0)"
        to: "(!ret 0)"
      - from: "!arg 1"
        to: "!ret 1"

  - package: "github.com/dgraph-io/badger/v4/table"
    receiver: "*Table"
    method: "VerifyChecksum"
    flows:
      - from: "!receiver"
        to: "!ret 0"

  - package: "github.com/dgraph-io/badger/v4"
    receiver: "valuePointer"
    method: "Encode"
    flows:
      - from: "!receiver"
        to: "(!ret 0)"

  - package: "github.com/dgraph-io/ristretto/v2/z"
    function: "Memclr"
    flows:
      - from: "!arg 0"
        to: "!arg 0"

  - package: "fmt"
    function: "Append"
    flows:
      - from: "(!arg 0)"
        to: "(!ret 0)"
      - from: "(!arg 1)"
        to: "(!ret 0)"

  - package: "fmt"
    function: "Appendf"
    flows:
      - from: "(!arg 0)"
        to: "(!ret 0)"
      - from: "!arg 1"
        to: "(!ret 0)"
      - from: "(!arg 2)"
        to: "(!ret 0)"

  - package: "fmt"
    function: "Appendln"
    flows:
      - from: "(!arg 0)"
        to: "(!ret 0)"
      - from: "(!arg 1)"
        to: "(!ret 0)"

  - package: "fmt"
    function: "Sprintln"
    flows:
      - from: "(!arg 0)"
        to: "!ret 0"

  - package: "syscall"
    function: "Faccessat"
    flows:
      - from: "!arg 1"
        to: "!ret 0"

  - package: "syscall"
    function: "Stat"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"

  - package: "syscall"
    function: "Lstat"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"

  - package: "github.com/dgraph-io/badger/v4/table"
    receiver: "*Table"
    method: "initBiggestAndSmallest$1"
    flows: []
