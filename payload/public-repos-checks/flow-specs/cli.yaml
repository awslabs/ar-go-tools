dataflow-summaries:
  - package: "github.com/spf13/cobra"
    receiver: "*Command"
    method: "InheritedFlags"
    flows:
      - from: "(!receiver).iflags"
        to: "!ret 0"
      - from: "(!receiver).parentsPflags"
        to: "!ret 0"
      - from: "(!receiver).globNormFunc"
        to: "!ret 0"
      - from: "(!receiver).flagErrorBuf"
        to: "!ret 0"
  - package: "github.com/cli/cli/v2/pkg/cmd/project"
    function: "NewCmdProject"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
  - package: "github.com/spf13/cobra"
    receiver: "*Command"
    method: "updateParentsPflags"
    flows:
      - from: "!receiver"
        to: "(!receiver).parentsPflags"
      - from: "(!receiver).flagErrorBuf"
        to: "(!receiver).parentsPflags"
      - from: "(!receiver).globNormFunc"
        to: "(!receiver).parentsPflags"
  - package: "github.com/spf13/cobra"
    receiver: "*Command"
    method: "LocalFlags"
    flows:
      - from: "(!receiver).lflags"
        to: "!ret 0"
      - from: "(!receiver).flagErrorBuf"
        to: "!ret 0"
      - from: "(!receiver).globNormFunc"
        to: "!ret 0"
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/cli/cli/v2/pkg/cmd/root"
    function: "addAliases"
    flows:
      - from: "!arg 0"
        to: "!arg 0"
      - from: "!arg 1"
        to: "!arg 0"
      - from: "!arg 2"
        to: "!arg 0"
      - from: "!arg 3"
        to: "!arg 0"
  - package: "github.com/cli/cli/v2/pkg/cmd/extension"
    function: "NewCmdExtension"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
