dataflow-summaries:
  - package: "github.com/aws/amazon-ssm-agent/agent/plugins/downloadcontent/httpresource/handler/auth/digest"
    receiver: "*Authorization"
    method: "String"
    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Infof"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Tracef"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Debugf"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Warnf"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg <format 0>"
        to: "!ret 0"
      - from: "!arg <params 1>"
        to: "!ret 0"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Errorf"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg <format 0>"
        to: "!ret 0"
      - from: "!arg <params 1>"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/csm"
    receiver: "*metric"
    method: "TruncateFields"
    flows:
      - from: "!receiver"
        to: "!receiver"
  - package: "github.com/aws/aws-sdk-go/aws/csm"
    receiver: "*metric"
    method: "SetException"
    flows:
      - from: "!arg 0"
        to: "!receiver"
  - package: "github.com/aws/aws-sdk-go/aws/csm"
    receiver: "*metric"
    method: "SetFinalException"
    flows:
      - from: "!arg 0"
        to: "!receiver"  
