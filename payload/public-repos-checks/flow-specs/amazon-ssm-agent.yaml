    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/service/s3"
    interface: "endpointARNGetter"
    method: "getEndpointARN"
    flows:
      - from: "!receiver"
        to: "!ret 0"
      - from: "!receiver"
        to: "!ret 1"
  - package: "github.com/aws/aws-sdk-go/service/s3"
    interface: "endpointARNGetter"
    method: "hasEndpointARN"
    flows:
      - from: "!receiver"
        to: "!ret 0"    
  - package: "github.com/aws/aws-sdk-go/aws/request"
    interface: "Retryer"
    method: "RetryRules"
    flows:
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/request"
    interface: "Retryer"
    method: "ShouldRetry"
    flows:
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/request"
