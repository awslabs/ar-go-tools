    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/request"
    interface: "Validator"
    method: "Validate"
    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/request"
