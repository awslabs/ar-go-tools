dataflow-summaries:
  - package: "github.com/aws/amazon-ssm-agent/agent/plugins/downloadcontent/httpresource/handler/auth/digest"
    receiver: "*Authorization"
    method: "String"
    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Infof"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Tracef"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Debugf"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Warnf"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg <format 0>"
        to: "!ret 0"
      - from: "!arg <params 1>"
        to: "!ret 0"
  - package: "github.com/aws/amazon-ssm-agent/agent/log"
    interface: "BasicT"
    method: "Errorf"
    flows:
      - from: "!arg 0"
        to: "!receiver"
      - from: "!arg 0"
        to: "!arg 1"
      - from: "!receiver"
        to: "!arg 1"
      - from: "!receiver"
        to: "!ret 0"
      - from: "!arg <format 0>"
        to: "!ret 0"
      - from: "!arg <params 1>"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/csm"
    receiver: "*metric"
    method: "TruncateFields"
    flows:
      - from: "!receiver"
        to: "!receiver"
  - package: "github.com/aws/aws-sdk-go/aws/csm"
    receiver: "*metric"
    method: "SetException"
    flows:
      - from: "!arg 0"
        to: "!receiver"
  - package: "github.com/aws/aws-sdk-go/aws/csm"
    receiver: "*metric"
    method: "SetFinalException"
    flows:
      - from: "!arg 0"
        to: "!receiver"  
  - package: "github.com/aws/aws-sdk-go/aws/awsutil"
    function: "rcopy"
    flows:
      - from: "!arg 1"
        to: "!arg 0"
  - package: "github.com/aws/aws-sdk-go/private/protocol/rest"
    function: "Build"
    flows:
      - from: "(!arg 0).Params"
        to: "!arg 0"
  - package: "github.com/aws/aws-sdk-go/private/protocol/rest"
    function: "Unmarshal"
    flows:
      - from: "!arg 0"
        to: "(!arg 0).Data"
      - from: "!arg 0"
        to: "(!arg 0).Error"
  - package: "github.com/aws/aws-sdk-go/private/protocol/rest"
    function: "UnmarshalMeta"
    flows:
      - from: "(!arg 0).HTTPResponse"
        to: "(!arg 0).RequestID"
      - from: "(!arg 0).HTTPResponse"
        to: "(!arg 0).Data"
      - from: "(!arg 0).Config"
        to: "(!arg 0).Data"
      - from: "(!arg 0).HTTPResponse"
        to: "(!arg 0).Error"
      - from: "(!arg 0).Config"
        to: "(!arg 0).Error"
  - package: "github.com/aws/aws-sdk-go/aws/request"
    receiver: "*Request"
    method: "Send"
    flows:
      - from: "(!receiver).Error"
        to: "!ret 0"
      - from: "!receiver"
        to: "(!receiver).Error"
      - from: "!receiver"
        to: "(!receiver).AttemptTime"
      - from: "!receiver"
        to: "(!receiver).HTTPResponse"
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/client"
    receiver: "*Client"
    method: "NewRequest"
    flows:
      - from: "(!receiver).Config"
        to: "!ret 0"
      - from: "(!receiver).ClientInfo"
        to: "!ret 0"
      - from: "(!receiver).Handlers"
        to: "!ret 0"
      - from: "(!receiver).Retryer"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws"
    function: "mergeInConfig"
    # Could get more precise flows if we could check field sensitivity
    flows:
      - from: "!arg 1"
        to: "!arg 0"
  - package: "github.com/aws/aws-sdk-go/private/protocol/xml/xmlutil"
    function: "UnmarshalXML"
    flows:
      - from: "!arg 1"
        to: "!arg 0"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!arg 0"
      - from: "!arg 2"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/awserr"
    interface: "Error"
    method: "Error"
    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/awserr"
    interface: "Error"
    method: "Code"
    flows:
      - from: "!receiver"
        to: "!ret 0"
  - package: "github.com/aws/aws-sdk-go/aws/awserr"
