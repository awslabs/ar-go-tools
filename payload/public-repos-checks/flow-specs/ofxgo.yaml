dataflow-summaries:
  # func invTransactions()
  - package: "github.com/aclindsa/ofxgo/cmd/ofx"
    function: "invTransactions"
    flows: []
  # func Getrlimit(which int, lim *Rlimit) (err error)
  - package: "syscall"
    function: "Getrlimit"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "(!arg 1)[*]"
  # func DialUDP(network string, laddr, raddr *UDPAddr) (*UDPConn, error)
  - package: "net"
    function: "DialUDP"
    flows:
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
  # func (d *Dialer) DialContext(ctx context.Context, network, address string) (Conn, error)
  - package: "net"
    receiver: "*Dialer"
    method: "DialContext"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
  # func SetsockoptInt(fd, level, opt int, value int) (err error)
  - package: "syscall"
    function: "SetsockoptInt"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 3"
        to: "!ret 0"
  # func Getsockname(fd int) (sa Sockaddr, err error)
  - package: "syscall"
    function: "Getsockname"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
  # func Getpeername(fd int) (sa Sockaddr, err error)
  - package: "syscall"
    function: "Getpeername"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
  # func Sendfile(outfd int, infd int, offset *int64, count int) (written int, err error)
  - package: "syscall"
    function: "Sendfile"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
      - from: "!arg 3"
        to: "!ret 0"
      - from: "!arg 3"
        to: "!ret 1"
  # func GetsockoptInt(fd, level, opt int) (value int, err error)
  - package: "syscall"
    function: "GetsockoptInt"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
  # func IoctlGetTermios(fd int, req uint) (*Termios, error)
  - package: "golang.org/x/sys/unix"
    function: "IoctlGetTermios"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 1"
  # func IoctlSetTermios(fd int, req uint, value *Termios) error
  - package: "golang.org/x/sys/unix"
    function: "IoctlSetTermios"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 1"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 0"
  # func Read(fd int, p []byte) (n int, err error)
  - package: "golang.org/x/sys/unix"
    function: "Read"
    flows:
      - from: "!arg 0"
        to: "!ret 0"
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 0"
  # func (lc *ListenConfig) ListenPacket(ctx context.Context, network, address string) (PacketConn, error)
  - package: "net"
    receiver: "*ListenConfig"
    method: "ListenPacket"
    flows:
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
  # func (lc *ListenConfig) Listen(ctx context.Context, network, address string) (Listener, error)
  - package: "net"
    receiver: "*ListenConfig"
    method: "Listen"
    flows:
      - from: "!arg 0"
        to: "!ret 1"
      - from: "!arg 1"
        to: "!ret 1"
      - from: "!arg 2"
        to: "!ret 0"
      - from: "!arg 2"
        to: "!ret 1"
