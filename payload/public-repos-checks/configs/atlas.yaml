options:
  project-root: "../../"
  reports-dir: "logs/argot"
  log-level: 3
  report-paths: true
  analysis-options:
    unsafe-max-depth: 15
    max-alarms: 30

targets:
  - name: "atlas-cli"
    files: ["./"]

dataflow-problems:
  summarize-on-demand: true
  field-sensitive-funcs: [".*"]
  check-ignores-unsound: true
  generate-unsoundness-report: true

  taint-tracking:
    - tag: "sql-injection"
      description: "SQL injection via database URLs and schema names"
      targets: ["atlas-cli"]
      severity: "HIGH"
      sources:
        - package: "ariga.io/atlas/cmd/atlas/internal/cmdapi"
          method: ".*Flags.*"
      sinks:
        - package: "ariga.io/atlas/sql/sqlclient"
          method: "Open"
        - package: "database/sql"
          method: ".*"

    - tag: "path-traversal"
      description: "Path traversal in migration directories"
      targets: ["atlas-cli"]
      severity: "HIGH"
      sources:
        - package: "ariga.io/atlas/cmd/atlas/internal/cmdapi"
          method: ".*dirURL.*"
      sinks:
        - package: "os"
          method: "(Open|Create|ReadFile|WriteFile)"
        - package: "io/fs"
          method: ".*"

    - tag: "command-injection"
      description: "Command injection in Docker operations"
      targets: ["atlas-cli"]
      severity: "HIGH"
      sources:
        - package: "ariga.io/atlas/cmd/atlas/internal/docker"
          method: ".*"
      sinks:
        - package: "os/exec"
          method: "Command"
