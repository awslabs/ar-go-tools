options:
  project-root: "./"
  reports-dir: "logs/argot"
  log-level: 3
  report-paths: true
  analysis-options:
    unsafe-max-depth: 30
    max-alarms: 30
dataflow-problems:
  user-specs: []
  summarize-on-demand: true
  generate-unsoundness-report: true
  check-ignores-unsound: true
  taint-tracking:
    - tag: "path-traversal"
      severity: "HIGH"
      description: "CLI output flag to file operations"
      targets: ["govatar-cli"]
      sources:
        - package: "github.com/urfave/cli/v2"
          method: "String"
      sinks:
        - package: "os"
          method: "Create"
      sanitizers:
        - package: "path/filepath"
          method: "Clean"
    - tag: "username-injection"
      severity: "MEDIUM"
      description: "CLI username to hash functions"
      targets: ["govatar-cli"]
      sources:
        - package: "github.com/urfave/cli/v2"
          method: "String"
      sinks:
        - package: "hash/fnv"
          method: "Write"
    - tag: "output-extension-to-encoder"
      severity: "LOW"
      description: "CLI output flag controls image encoding format"
      targets: ["govatar-cli"]
      sources:
        - package: "github.com/urfave/cli/v2"
          method: "String"
      sinks:
        - package: "image/jpeg"
          method: "Encode"
        - package: "image/gif"
          method: "Encode"
        - package: "image/png"
          method: "Encode"
    - tag: "cli-args-to-log"
      severity: "MEDIUM"
      description: "CLI positional args flow to log output"
      targets: ["govatar-cli"]
      sources:
        - package: "github.com/urfave/cli/v2"
          method: "First"
      sinks:
        - package: "log"
          method: "Fatal"
    - tag: "username-to-prng-seed"
      severity: "LOW"
      description: "Username controls PRNG seed for avatar generation"
      targets: ["govatar-cli"]
      sources:
        - package: "github.com/urfave/cli/v2"
          method: "String"
      sinks:
        - package: "math/rand"
          method: "NewSource"
targets:
  - name: "govatar-cli"
    files:
      - "./govatar"
