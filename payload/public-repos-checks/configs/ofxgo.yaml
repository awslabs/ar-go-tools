options:
  project-root: "."
  reports-dir: "logs/argot"
  log-level: 3
  report-paths: true
  analysis-options:
    unsafe-max-depth: 15
    max-alarms: 30
targets:
  - name: "ofxgo-cmd"
    files: ["./cmd/ofx/"]
dataflow-problems:
  summarize-on-demand: true
  field-sensitive-funcs: [".*"]
  # Taint tracking problems
  taint-tracking:
    - tag: "credential-logging"
      description: "Checking that credentials (UserID, UserPass, passwords) don't get logged or printed"
      targets: ["ofxgo-cmd"]
      severity: "HIGH"
      sources:
        # OFX credential fields
        - package: "github.com/aclindsa/ofxgo"
          method: "UserID"
        - package: "github.com/aclindsa/ofxgo"
          method: "UserPass"
        # Password input functions
        - package: "golang.org/x/term"
          method: "ReadPassword"
        - package: "syscall"
          method: "Syscall"
      sinks:
        # Standard output/logging functions
        - package: "fmt"
          method: "^(Print|Printf|Println|Sprint|Sprintf|Sprintln|Fprint|Fprintf|Fprintln).*"
        - package: "log"
          method: "^(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln).*"
        # Error handling that might expose credentials
        - package: "errors"
          method: "New"
        - package: "fmt"
          method: "Errorf"
      sanitizers:
        # Functions that mask or hash credentials
        - package: "crypto/.*"
          method: ".*"
        - package: "hash/.*"
          method: ".*"
    - tag: "account-info-logging"
      description: "Checking that sensitive account information doesn't get logged inappropriately"
      targets: ["ofxgo-cmd"]
      severity: "MEDIUM"
      sources:
        # Account identifiers that might be sensitive
        - package: "ofxgo"
          type: "(CCAct|InvAcct|BankAcct)"
          field: "AcctID"
        - package: "ofxgo"
          type: "BankAcct"
          field: "BankID"
        - package: "ofxgo"
          type: "InvAcct"
          field: "BrokerID"
      sinks:
        # Only flag direct printing to stdout/stderr, not structured logging
        - package: "fmt"
          method: "^(Print|Printf|Println)$"
        - package: "log"
          method: "^(Print|Printf|Println)$"
      sanitizers:
        # Allow masked/truncated display
        - package: "strings"
          method: "Replace"
        - package: ".*"
          method: ".*[Mm]ask.*"
        - package: ".*"
          method: ".*[Tt]runcate.*"
