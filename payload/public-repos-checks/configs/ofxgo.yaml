# Argot Configuration for OFXGo
# Static analysis configuration for the OFXGo library and CLI tool

options:
  project-root: "./"                    # Root directory for relative paths
  reports-dir: "logs/argot"             # Directory for analysis reports
  log-level: 3                          # Info level logging (1=Error, 2=Warn, 3=Info, 4=Debug, 5=Trace)
  report-paths: true                    # Generate detailed path reports for dataflow analyses
  analysis-options:
    unsafe-max-depth: 15                # Limit call depth to 15 for performance
    max-alarms: 30                      # Maximum number of alarms to report

targets:
  # OFXGo library - core library code
  - name: "ofxgo-library"
    files:
      - "./"
  
  # OFX CLI tool - command-line client for querying OFX servers
  - name: "ofx-cli"
    files:
      - "./cmd/ofx"
