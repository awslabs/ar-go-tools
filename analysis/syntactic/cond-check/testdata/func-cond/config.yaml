options:
  log-level: 4

syntactic-problems:
  cond-checks:
    - tag: funcCond
      # Calling Foo requires FooPreCheck
      call:
        method: ^FooFunc$
        package: func-cond$
      requires:
        - guard: ["!ResourceCheck()#1 != nil:error", "ResourceCheck()#0"]
        - guard: ["FooPreCheck()"]
