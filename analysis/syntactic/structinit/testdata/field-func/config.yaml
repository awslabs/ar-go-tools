syntactic-problems:
  struct-inits:
    - struct:
        type: ".*target$"
      fields-set:
        - field: "f"
          value:
            package: "(field-func)|(main)|(command-line-arguments)"
            method: "^Func"
      filters:
        - method: "^allowedBadInit$"
          package: "(field-func)|(main)|(command-line-arguments)"
      must-reinit:
        - method: "^allowedBadInit$"
          package: ".*"
