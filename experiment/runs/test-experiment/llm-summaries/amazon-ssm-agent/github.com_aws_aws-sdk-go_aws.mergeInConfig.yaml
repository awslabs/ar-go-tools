# mergeInConfig(dst *Config, other *Config) copies each field of `other`
# (!arg 1) into the corresponding field of `dst` (!arg 0) whenever the
# `other` field is non-nil/non-default. This is a pure field-by-field copy:
# every field of `other` flows only into the identically-named field of
# `dst`, never into a different field, and there is no aggregation of
# multiple `other` fields into one `dst` field. Because of this 1:1
# correspondence, a single field-sensitive flow entry per field is the
# accurate representation (not over- or under-approximating), rather than a
# blanket `!arg 1` -> `!arg 0` flow, since fields don't mix.
#
# The function has no return value (void) and does not read from dst except
# implicitly overwriting it, so there are no `!ret` flows.
#
# Fields covered (all mirrored dst.X = other.X under a nil/unset check):
# CredentialsChainVerboseErrors, Credentials, Endpoint, EndpointResolver,
# Region, DisableSSL, HTTPClient, LogLevel, Logger, MaxRetries, Retryer,
# DisableParamValidation, DisableComputeChecksums, S3ForcePathStyle,
# S3Disable100Continue, S3UseAccelerate, S3DisableContentMD5Validation,
# S3UseARNRegion, UseDualStack, UseDualStackEndpoint,
# EC2MetadataDisableTimeoutOverride, EC2MetadataEnableFallback, SleepDelay,
# DisableRestProtocolURICleaning, EnforceShouldRetryCheck,
# EnableEndpointDiscovery, DisableEndpointHostPrefix, STSRegionalEndpoint,
# S3UsEast1RegionalEndpoint, LowerCaseHeaderMaps, UseFIPSEndpoint.
#
# Some fields (Credentials, EndpointResolver, HTTPClient, Logger, Retryer)
# are interface-typed; per the interface field-sensitivity rule these are
# still represented as field paths (!arg 1).FieldName -> (!arg 0).FieldName
# since the field itself (not something nested inside the interface) is the
# access path endpoint, which is allowed (we do not go deeper than the
# interface-typed field, and we don't here).

dataflow-summaries:
  - package: "github.com/aws/aws-sdk-go/aws"
    function: "mergeInConfig"
    flows:
      - from: "(!arg 1).CredentialsChainVerboseErrors"
        to: "(!arg 0).CredentialsChainVerboseErrors"
      - from: "(!arg 1).Credentials"
        to: "(!arg 0).Credentials"
      - from: "(!arg 1).Endpoint"
        to: "(!arg 0).Endpoint"
      - from: "(!arg 1).EndpointResolver"
        to: "(!arg 0).EndpointResolver"
      - from: "(!arg 1).Region"
        to: "(!arg 0).Region"
      - from: "(!arg 1).DisableSSL"
        to: "(!arg 0).DisableSSL"
      - from: "(!arg 1).HTTPClient"
        to: "(!arg 0).HTTPClient"
      - from: "(!arg 1).LogLevel"
        to: "(!arg 0).LogLevel"
      - from: "(!arg 1).Logger"
        to: "(!arg 0).Logger"
      - from: "(!arg 1).MaxRetries"
        to: "(!arg 0).MaxRetries"
      - from: "(!arg 1).Retryer"
        to: "(!arg 0).Retryer"
      - from: "(!arg 1).DisableParamValidation"
        to: "(!arg 0).DisableParamValidation"
      - from: "(!arg 1).DisableComputeChecksums"
        to: "(!arg 0).DisableComputeChecksums"
      - from: "(!arg 1).S3ForcePathStyle"
        to: "(!arg 0).S3ForcePathStyle"
      - from: "(!arg 1).S3Disable100Continue"
        to: "(!arg 0).S3Disable100Continue"
      - from: "(!arg 1).S3UseAccelerate"
        to: "(!arg 0).S3UseAccelerate"
      - from: "(!arg 1).S3DisableContentMD5Validation"
        to: "(!arg 0).S3DisableContentMD5Validation"
      - from: "(!arg 1).S3UseARNRegion"
        to: "(!arg 0).S3UseARNRegion"
      - from: "(!arg 1).UseDualStack"
        to: "(!arg 0).UseDualStack"
      - from: "(!arg 1).UseDualStackEndpoint"
        to: "(!arg 0).UseDualStackEndpoint"
      - from: "(!arg 1).EC2MetadataDisableTimeoutOverride"
        to: "(!arg 0).EC2MetadataDisableTimeoutOverride"
      - from: "(!arg 1).EC2MetadataEnableFallback"
        to: "(!arg 0).EC2MetadataEnableFallback"
      - from: "(!arg 1).SleepDelay"
        to: "(!arg 0).SleepDelay"
      - from: "(!arg 1).DisableRestProtocolURICleaning"
        to: "(!arg 0).DisableRestProtocolURICleaning"
      - from: "(!arg 1).EnforceShouldRetryCheck"
        to: "(!arg 0).EnforceShouldRetryCheck"
      - from: "(!arg 1).EnableEndpointDiscovery"
        to: "(!arg 0).EnableEndpointDiscovery"
      - from: "(!arg 1).DisableEndpointHostPrefix"
        to: "(!arg 0).DisableEndpointHostPrefix"
      - from: "(!arg 1).STSRegionalEndpoint"
        to: "(!arg 0).STSRegionalEndpoint"
      - from: "(!arg 1).S3UsEast1RegionalEndpoint"
        to: "(!arg 0).S3UsEast1RegionalEndpoint"
      - from: "(!arg 1).LowerCaseHeaderMaps"
        to: "(!arg 0).LowerCaseHeaderMaps"
      - from: "(!arg 1).UseFIPSEndpoint"
        to: "(!arg 0).UseFIPSEndpoint"
