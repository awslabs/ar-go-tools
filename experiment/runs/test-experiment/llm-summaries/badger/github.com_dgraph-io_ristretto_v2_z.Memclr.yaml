#
# This function overwrites every byte of the argument slice with the zero value
# using a runtime primitive (runtime.memclrNoHeapPointers). The content written
# into the slice is always the constant 0 -- it is not derived from any other
# input, and the function has no return value.
#
# Consequences for dataflow:
#  - There is no external source of data that flows into the argument's
#    content: the write is a constant zero-fill, not derived from another
    #    argument or any other value.
#  - The slice is cleared (sanitized) rather than tainted: any pre-existing
#    taint on the argument's contents is effectively erased, not propagated
#    from anywhere else.
#  - There is no return value and no other argument to relate it to.
#
# Therefore, no meaningful data flow exists to declare for this function: it is
# not a propagator (it doesn't route data from one place to another) and not
# a case where an output's value is determined by some other input's value.
