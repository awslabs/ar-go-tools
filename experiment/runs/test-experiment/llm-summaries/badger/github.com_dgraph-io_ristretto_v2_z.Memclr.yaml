#
#     // Memclr clears the given byte slice using the runtime's fast memclr.
#     func Memclr(data []byte) {
#         if len(data) == 0 {
#             return
#         }
#         memclrNoHeapPointers(unsafe.Pointer(&data[0]), uintptr(len(data)))
