dataflow-summaries:
- flows:
  - from: '!arg <data 2>'
    to: '!ret 0'
  - from: '!arg <operation 0>'
    to: '!ret 0'
  - from: '!arg <params 1>'
    to: '!ret 0'
  - from: (!receiver).ClientInfo
    to: '!ret 0'
  - from: (!receiver).Config
    to: '!ret 0'
  - from: (!receiver).Handlers
    to: '!ret 0'
  - from: (!receiver).Retryer
    to: '!ret 0'
  method: NewRequest
  package: github.com/aws/aws-sdk-go/aws/client
  receiver: '*Client'
- flows:
  - from: '!arg 0'
    to: (!receiver).AWSException
  - from: '!arg 0'
    to: (!receiver).AWSExceptionMessage
  - from: '!arg 0'
    to: (!receiver).SDKException
  - from: '!arg 0'
    to: (!receiver).SDKExceptionMessage
  method: SetException
  package: github.com/aws/aws-sdk-go/aws/csm
  receiver: '*metric'
- flows:
  - from: '!arg 0'
    to: (!receiver).FinalAWSException
  - from: '!arg 0'
    to: (!receiver).FinalAWSExceptionMessage
  - from: '!arg 0'
    to: (!receiver).FinalSDKException
  - from: '!arg 0'
    to: (!receiver).FinalSDKExceptionMessage
  method: SetFinalException
  package: github.com/aws/aws-sdk-go/aws/csm
  receiver: '*metric'
