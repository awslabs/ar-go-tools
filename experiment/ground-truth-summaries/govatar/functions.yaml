# RQ1 ground-truth summaries for repo 'govatar'.
# selection: seed=20260702, this repo got 1 of 25 methods drawn from 54 distinct feature-free candidates.
dataflow-summaries:
  # ==========================================================================
  # (*text/tabwriter.Writer).Write   (receiver)
  # go doc:
  #   package tabwriter // import "text/tabwriter"
  #   
  #   func (b *Writer) Write(buf []byte) (n int, err error)
  #       Write writes buf to the writer b. The only errors returned are ones
  #       encountered while writing to the underlying output stream.
  # docs: https://pkg.go.dev/text/tabwriter#Writer.Write
  #
  # Write scans buf and, for each cell/escape span it delimits, appends that span into
  # (!receiver).buf. buf taints (!receiver).buf. n is set to len(buf). err is only touched by
  # handlePanic on a write failure to the underlying output, not by buf's content.
  # ==========================================================================
  - package: 'text/tabwriter'
    receiver: '*Writer'
    method: 'Write'
    flows:
      - from: '(!arg 0)[*]'
        to: '(!receiver).buf'
      - from: '(!arg 0)[*]'
        to: '!ret 0'
